name: Build & Deploy Sphinx to GitHub Pages (root)

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          # Root-Requirements (du sagtest: ./requirements.txt)
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          # Falls Sphinx nicht in requirements.txt steht:
          python -m pip install sphinx
          # Häufig benötigte Extras – ungefährlich, falls nicht genutzt:
          python -m pip install myst-parser sphinx-rtd-theme

      - name: Sanity check doc/ exists and conf.py
        run: |
          echo "Repo root:"
          ls -la
          echo "doc/ directory:"
          ls -la doc || true
          test -f doc/conf.py || (echo "::error file=doc/conf.py::conf.py fehlt in doc/"; exit 2)

      - name: Build Sphinx site (verbose, full traceback)
        env:
          SPHINXOPTS: "-T -E -a -N"   # -T: Traceback, -E: keine Caches, -a: alle neu bauen, -N: no color
        run: |
          python -m sphinx -b html doc _site $SPHINXOPTS
          # GitHub Pages braucht das:
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
