name: Build & Deploy Sphinx to GitHub Pages (root)

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install sphinx
          # häufig genutzte optionale Extensions/Themes (ungefährlich, wenn unbenutzt)
          python -m pip install myst-parser sphinx-rtd-theme

      - name: Detect Sphinx source dir (conf.py)
        id: detect
        run: |
          echo "Repo tree (top-level):"
          ls -la || true
          candidates=(
            "doc"
            "doc/source"
            "docs"
            "docs/source"
            "documentation"
            "documentation/source"
          )
          found=""
          for c in "${candidates[@]}"; do
            if [ -f "$c/conf.py" ]; then
              found="$c"
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "::error::Keine conf.py gefunden. Erwartet z.B. doc/conf.py oder doc/source/conf.py"
            echo "Tipp: Prüfe, wo dein Sphinx-Quickstart conf.py angelegt hat."
            exit 2
          fi
          echo "Gefundener Sphinx-Quellordner: $found"
          echo "src=$found" >> "$GITHUB_OUTPUT"

      - name: Build Sphinx site (verbose)
        env:
          SPHINXOPTS: "-T -E -a -N"
        run: |
          python -m sphinx -b html "${{ steps.detect.outputs.src }}" _site $SPHINXOPTS
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
